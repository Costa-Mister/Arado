<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Torto Arado - Game Feel & Ação (Phaser 3)</title>
    <!-- Phaser 3.80 via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0907;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Controles Touch Virtuais para Mobile */
        #touch-controls {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            height: 130px;
            display: none;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
            z-index: 100;
        }
        .dpad {
            position: relative;
            width: 130px;
            height: 130px;
            pointer-events: auto;
        }
        .dbtn {
            position: absolute;
            background: rgba(230, 210, 180, 0.35);
            border: 2px solid rgba(120, 80, 40, 0.7);
            border-radius: 10px;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
            font-size: 18px;
        }
        .dbtn:active { background: rgba(230, 210, 180, 0.75); }
        #btn-up { top: 0; left: 44px; }
        #btn-down { bottom: 0; left: 44px; }
        #btn-left { top: 44px; left: 0; }
        #btn-right { top: 44px; right: 0; }
        
        .action-btns {
            position: relative;
            width: 100px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        .abtn {
            width: 72px;
            height: 72px;
            background: rgba(212, 107, 39, 0.6);
            border: 3px solid rgba(140, 50, 20, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            text-shadow: 1px 1px 2px #000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .abtn:active { background: rgba(212, 107, 39, 0.95); }

        @media (max-pointer: coarse) {
            #touch-controls { display: flex; }
        }

</head>
<body>

<div id="game-container"></div>

<!-- Touch Controls Overlay para Mobile -->
<div id="touch-controls">
    <div class="dpad">
        <div class="dbtn" id="btn-up">▲</div>
        <div class="dbtn" id="btn-down">▼</div>
        <div class="dbtn" id="btn-left">◄</div>
        <div class="dbtn" id="btn-right">►</div>
    </div>
    <div class="action-btns">
        <div class="abtn" id="btn-action">AÇÃO / BATER</div>
    </div>
</div>

<script>
/**
 * TORTO ARADO - GAME FEEL & AÇÃO (PHASER 3)
 * Motor de Áudio, Mini-games, Juice Visual e Ritmo
 */

// --- 1. SÍNTESE DE ÁUDIO PROCEDURAL (Web Audio API) ---
class SoundEngine {
    constructor() {
        this.ctx = null;
        this.muted = false;
        this.bgmInterval = null;
    }
    init() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
            this.startBGM();
        } else if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }
    toggleMute() {
        this.muted = !this.muted;
        return this.muted;
    }
    playTone(freq, type, duration, vol=0.06) {
        if (this.muted || !this.ctx) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch(e){}
    }
    sfxStep() { this.playTone(140 + Math.random()*25, 'triangle', 0.05, 0.015); }
    sfxPickup() { 
        this.playTone(523.25, 'sine', 0.08, 0.06); 
        setTimeout(() => this.playTone(659.25, 'sine', 0.1, 0.06), 60);
        setTimeout(() => this.playTone(783.99, 'sine', 0.12, 0.06), 120);
    }
    sfxClap() { // Som de palma / espantar pássaro
        this.playTone(220, 'square', 0.08, 0.05);
        setTimeout(() => this.playTone(440, 'triangle', 0.1, 0.05), 40);
    }
    sfxDrum() { // Som de tambor para Jarê
        this.playTone(90, 'sawtooth', 0.15, 0.12);
    }
    sfxText() { this.playTone(320 + Math.random()*50, 'square', 0.02, 0.008); }
    sfxChupim() {
        this.playTone(1500, 'sine', 0.04, 0.03);
        setTimeout(() => this.playTone(1900, 'sine', 0.05, 0.03), 30);
    }
    startBGM() {
        if (this.bgmInterval) return;
        const notes = [293.66, 329.63, 392.00, 440.00, 523.25, 587.33];
        this.bgmInterval = setInterval(() => {
            if (this.ctx && !this.muted) {
                let note = notes[Math.floor(Math.random() * notes.length)];
                this.playTone(note, 'sine', 0.6, 0.015);
                if (Math.random() > 0.4) {
                    setTimeout(() => this.playTone(note * 1.25, 'triangle', 0.4, 0.01), 200);
                }
            }
        }, 800);
    }
}
const audio = new SoundEngine();

const GAME_WIDTH = 480;
const GAME_HEIGHT = 270;

const touchState = { up: false, down: false, left: false, right: false, interact: false };

function bindTouch(id, key) {
    const el = document.getElementById(id);
    if (!el) return;
    const start = (e) => { e.preventDefault(); audio.init(); touchState[key] = true; };
    const end = (e) => { e.preventDefault(); touchState[key] = false; };
    el.addEventListener('touchstart', start);
    el.addEventListener('touchend', end);
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
}
bindTouch('btn-up', 'up');
bindTouch('btn-down', 'down');
bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');
bindTouch('btn-action', 'interact');

// --- 2. BOOT & TEXTURAS 16-BIT ---

            "    6666    ", "   655556   ", "  65433456  ", "  65313156  ", "   6533356  ",
            "    3333    ", "  11222211  ", " 1112222111 ", " 1111221111 ", "  22222222  ",
            "  22    22  ", "  33    33  "
        ], { '1': '#d46b27', '2': '#25758a', '3': '#5c3a21', '4': '#111111', '5': '#4a2810', '6': '#8b5a2b' });

        this.createPixelTexture('belonisia', [
            "    6666    ", "   655556   ", "  65433456  ", "  65313156  ", "   6533356  ",
            "    3333    ", "  22111122  ", " 2221111222 ", " 2222112222 ", "  11111111  ",
            "  11    11  ", "  33    33  "
        ], { '1': '#e65c00', '2': '#25758a', '3': '#5c3a21', '4': '#111111', '5': '#4a2810', '6': '#8b5a2b' });

        this.createPixelTexture('zeca', [
            "  77777777  ", " 7777777777 ", "   333333   ", "   343343   ", "   333333   ",
            "  55222255  ", "  55222255  ", "  22222222  ", "  33    33  "
        ], { '2': '#3a2e2b', '3': '#5c3a21', '4': '#111111', '5': '#29543e', '7': '#d9b382' });

        this.createPixelTexture('donana', [
            "    8888    ", "   833338   ", "  83433438  ", "  83131338  ", "   833338   ",
            "    3333    ", "  99999999  ", " 9999999999 ", "  99999999  ", "   33  33   "
        ], { '1': '#ffffff', '3': '#4a2c17', '4': '#111111', '8': '#dcdcdc', '9': '#8b0000' });

        this.createPixelTexture('fusco', [
            "    22100 ", "   223210 ", " 02222220 ", "  222222  ", "  20 200  "
        ], { '1': '#d2b48c', '2': '#8d5b4c', '3': '#111111' });

        this.createPixelTexture('chupim', [
            "  110 ", " 1132 ", "  110 ", "  100 "
        ], { '1': '#1a1a2e', '2': '#e94560', '3': '#ffffff' });

        this.createPixelTexture('flower_pink', [" 121 ", "2332", " 121 "], { '1': '#ffb3c1', '2': '#ff758f', '3': '#ffb703' });
        this.createPixelTexture('flower_yellow', [" 121 ", "2332", " 121 "], { '1': '#ffee93', '2': '#ffb703', '3': '#d46b27' });
        this.createPixelTexture('flower_purple', [" 121 ", "2332", " 121 "], { '1': '#e0aaff', '2': '#9d4edd', '3': '#ffb703' });
        this.createPixelTexture('herb', [" 2 ", "121", "232", " 3 "], { '1': '#52b788', '2': '#b7e4c7', '3': '#2d4a22' });
        this.createPixelTexture('lenco', ["111", "121", "111"], { '1': '#25758a', '2': '#ffe66d' });
        this.createPixelTexture('boneca', [" 2 ", "111", " 3 "], { '1': '#ffe66d', '2': '#e63946', '3': '#4a2e1b' });
        this.createPixelTexture('espelho', [" 22 ", " 21 ", "  3 "], { '1': '#ffffff', '2': '#ffd700', '3': '#4a2e1b' });

        this.createPixelTexture('tree', [
            "    111111    ", "  1111111111  ", " 111221221111 ", "11112222221111", "11122222222211",
            " 111222222211 ", "  1111111111  ", "    333333    ", "    33  33    ", "    33  33    "
        ], { '1': '#1b4332', '2': '#2d6a4f', '3': '#4a2e1b' });

        this.createPixelTexture('petal', ["11", "11"], { '1': '#ffb3c1' });
        this.createPixelTexture('firefly', ["1"], { '1': '#ffe66d' });
        this.createPixelTexture('star', [" 1 ", "111", " 1 "], { '1': '#ffe66d' });
        this.createPixelTexture('candle', ["1", "2"], { '1': '#ffe66d', '2': '#e63946' });
        this.createPixelTexture('pilao', [" 22 ", "2112", "2112", " 22 "], { '1': '#8d5b4c', '2': '#4a2e1b' });
    }

    createPixelTexture(key, matrix, palette) {
        const g = this.add.graphics();
        const pSize = 2;
        for (let y = 0; y < matrix.length; y++) {
            for (let x = 0; x < matrix[y].length; x++) {
                const char = matrix[y][x];
                if (char !== ' ' && palette[char]) {
                    g.fillStyle(Phaser.Display.Color.HexStringToColor(palette[char]).color, 1);
                    g.fillRect(x * pSize, y * pSize, pSize, pSize);
                }
            }
        }
        g.generateTexture(key, matrix[0].length * pSize, matrix.length * pSize);
        g.destroy();
    }
}

// --- 3. TELA INICIAL ---
class TitleScene extends Phaser.Scene {
    constructor() { super({ key: 'TitleScene' }); }
    create() {
        const bg = this.add.graphics();
        bg.fillGradientStyle(0x2b1e3a, 0x2b1e3a, 0xd46b27, 0xf4a261, 1);
        bg.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        this.add.image(GAME_WIDTH / 2, GAME_HEIGHT / 2 + 10, 'tree').setScale(4.5);
        this.add.image(GAME_WIDTH / 2 - 24, GAME_HEIGHT / 2 + 50, 'bibiana').setScale(2.2);
        this.add.image(GAME_WIDTH / 2 + 24, GAME_HEIGHT / 2 + 50, 'belonisia').setScale(2.2);

        this.add.particles(0, 0, 'petal', {
            x: { min: 0, max: GAME_WIDTH }, y: 0, lifespan: 4000, speedY: { min: 20, max: 50 },
            speedX: { min: -10, max: 10 }, scale: { start: 1, end: 0.5 }, quantity: 1, frequency: 300
        });

        this.add.text(GAME_WIDTH / 2, 45, 'TORTO ARADO', {
            fontFamily: 'Courier New', fontSize: '28px', fontStyle: 'bold', color: '#fff8e7', stroke: '#1a0c06', strokeThickness: 5
        }).setOrigin(0.5);

        this.add.text(GAME_WIDTH / 2, 72, 'Edição Game Feel & Ação', {
            fontFamily: 'Courier New', fontSize: '10px', color: '#ffe66d', fontStyle: 'italic'
        }).setOrigin(0.5);

        const muteBtn = this.add.text(GAME_WIDTH - 20, 15, '🔊 Som: ON', {
            fontFamily: 'Courier New', fontSize: '9px', color: '#ffffff', backgroundColor: '#4a2e1b', padding: { x: 4, y: 2 }
        }).setOrigin(1, 0).setInteractive({ useHandCursor: true });
        
        muteBtn.on('pointerdown', () => {
            let isMuted = audio.toggleMute();
            muteBtn.setText(isMuted ? '🔇 Som: OFF' : '🔊 Som: ON');
        });

        const btnBg = this.add.rectangle(GAME_WIDTH / 2, 205, 170, 32, 0x6b2d18)
            .setStrokeStyle(2, 0xf4a261).setInteractive({ useHandCursor: true });

        const btnText = this.add.text(GAME_WIDTH / 2, 205, 'INICIAR JORNADA', {
            fontFamily: 'Courier New', fontSize: '11px', fontStyle: 'bold', color: '#ffffff'
        }).setOrigin(0.5);

        const startGame = () => {
            audio.init();
            audio.sfxPickup();
            this.scene.start('GameScene');
        };

        btnBg.on('pointerover', () => { btnBg.setFillStyle(0xd46b27); btnText.setColor('#ffe66d'); });
        btnBg.on('pointerout', () => { btnBg.setFillStyle(0x6b2d18); btnText.setColor('#ffffff'); });
        btnBg.on('pointerdown', startGame);

        this.input.keyboard.on('keydown-SPACE', startGame);
        this.input.keyboard.on('keydown-ENTER', startGame);

        this.tweens.add({
            targets: [btnBg, btnText], y: '+=2', duration: 1000, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
        });
    }
}

// --- 4. CENA DO JOGO E MINI-GAMES ---
class GameScene extends Phaser.Scene {
    constructor() { super({ key: 'GameScene' }); }

    create() {
        this.currentCap = 1;
        this.dialogueActive = false;
        this.dialogueQueue = [];
        this.collectedItemsCount = 0;
        this.miniGameActive = false;

        this.buildRichEnvironment();

        this.interactables = this.physics.add.staticGroup();
        this.chupinsGroup = this.physics.add.group();

        this.playerShadow = this.add.ellipse(80, 148, 16, 8, 0x000000, 0.4);
        this.player = this.physics.add.sprite(80, 140, 'bibiana').setScale(2).setCollideWorldBounds(true);

        this.tweens.add({
            targets: this.player, scaleY: 2.05, duration: 1200, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
        });

        // Partículas
        this.add.particles(0, 0, 'petal', {
            x: { min: 0, max: GAME_WIDTH }, y: 0, lifespan: 4000, speedY: { min: 15, max: 35 },
            speedX: { min: -10, max: 10 }, scale: { start: 1, end: 0.4 }, quantity: 1, frequency: 300
        });

        this.add.particles(0, 0, 'firefly', {
            x: { min: 0, max: GAME_WIDTH }, y: { min: 0, max: GAME_HEIGHT - 40 }, lifespan: 3000,
            speedX: { min: -10, max: 10 }, speedY: { min: -10, max: 10 }, scale: { start: 1, end: 0.2 },
            alpha: { start: 0.8, end: 0.1 }, quantity: 1, frequency: 350
        });

        const vignette = this.add.graphics();
        vignette.fillGradientStyle(0xf4a261, 0xf4a261, 0x2b1e3a, 0x2b1e3a, 0.15);
        vignette.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        vignette.setScrollFactor(0);

        this.cursors = this.input.keyboard.createCursorKeys();
        this.wasd = this.input.keyboard.addKeys('W,A,S,D');
        this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

        this.createUI();
        this.loadCapitulo(1);
    }

    buildRichEnvironment() {
        const baseGrama = this.add.graphics();
        baseGrama.fillStyle(0x2d4a22, 1);
        baseGrama.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        baseGrama.fillStyle(0x386641, 0.6);
        for (let i = 0; i < 40; i++) {
            baseGrama.fillRect(Math.random() * GAME_WIDTH, Math.random() * GAME_HEIGHT, 16, 16);
        }

        baseGrama.fillStyle(0x8d5b4c, 0.9);
        baseGrama.fillRoundedRect(40, 130, 400, 36, 10);
        baseGrama.fillStyle(0xa98467, 0.8);
        for (let i = 50; i < 420; i += 24) {
            baseGrama.fillCircle(i, 148, 3);
        }

        this.river = this.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT - 22, GAME_WIDTH, 44, 0x1d4e89);
        this.riverReflex = this.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT - 32, GAME_WIDTH, 6, 0x48cae4, 0.5);
        this.tweens.add({ targets: this.riverReflex, alpha: 0.9, duration: 600, yoyo: true, repeat: -1 });

        baseGrama.fillStyle(0x582f0e, 1);
        for (let x = 20; x < GAME_WIDTH - 20; x += 30) {
            baseGrama.fillRect(x, 85, 4, 30);
        }
        baseGrama.fillRect(10, 92, GAME_WIDTH - 20, 4);

        const flowerTypes = ['flower_pink', 'flower_yellow', 'flower_purple'];
        for (let i = 0; i < 22; i++) {
            let fx = Phaser.Math.Between(20, GAME_WIDTH - 20);
            let fy = Phaser.Math.Between(40, GAME_HEIGHT - 50);
            let f = this.add.image(fx, fy, Phaser.Math.RND.pick(flowerTypes)).setScale(1.2);
            this.tweens.add({ targets: f, angle: { from: -5, to: 5 }, duration: 1500, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
        }

        this.add.image(70, 50, 'tree').setScale(3);
        this.add.image(410, 60, 'tree').setScale(3);
    }

    // --- SISTEMA DE JUICE (FEEDBACK VISUAL) ---
    triggerJuice(x, y) {
        // Micro-tremida de câmera
        this.cameras.main.shake(150, 0.008);

        // Explosão de estrelinhas e pétalas
        const emitter = this.add.particles(x, y, 'star', {
            speed: { min: 40, max: 100 },
            angle: { min: 0, max: 360 },
            scale: { start: 1, end: 0.2 },
            lifespan: 500,
            quantity: 8
        });
        this.time.delayedCall(500, () => emitter.destroy());

        // Pulinho de alegria do personagem
        this.tweens.add({
            targets: this.player,
            y: '-=12',
            duration: 150,
            yoyo: true,
            ease: 'Quad.easeOut'
        });
    }

    // --- CAPÍTULOS NARRATIVOS & MINI-GAMES ---
    loadCapitulo(capNum) {
        this.currentCap = capNum;
        this.collectedItemsCount = 0;
        this.interactables.clear(true, true);
        this.chupinsGroup.clear(true, true);
        if (this.pilaoObj) this.pilaoObj.destroy();
        if (this.rhythmContainer) this.rhythmContainer.destroy();

        if (this.capTitleText) {
            if (capNum === 1) {
                this.capTitleText.setText('CAPÍTULO 1: Fio de Corte');
                this.hudObjText.setText('Colete 3 lembranças e brinque com o Fusco.');
                this.setupCapitulo1();
            } else if (capNum === 2) {
                this.capTitleText.setText('CAPÍTULO 2: Torto Arado');
                this.hudObjText.setText('Bata palmas para espantar chupins e use o pilão!');
                this.setupCapitulo2();
            } else if (capNum === 3) {
                this.capTitleText.setText('CAPÍTULO 3: Rio de Sangue');
                this.hudObjText.setText('Acenda as velas no desafio rítmico do tambor!');
                this.setupCapitulo3();
            }
        }
    }

    setupCapitulo1() {
        this.player.setPosition(60, 140);
        this.add.rectangle(380, 75, 110, 70, 0x7f4f24).setStrokeStyle(2, 0x4a2e1b);
        this.add.rectangle(380, 38, 120, 18, 0x582f0e);

        this.belonisia = this.physics.add.staticSprite(100, 140, 'belonisia').setScale(2);
        this.donana = this.physics.add.staticSprite(370, 110, 'donana').setScale(2);
        this.fusco = this.physics.add.sprite(180, 150, 'fusco').setScale(2);
        this.tweens.add({ targets: this.fusco, y: '-=6', duration: 450, yoyo: true, repeat: -1 });

        const item1 = this.interactables.create(150, 80, 'lenco').setScale(1.5);
        item1.setData('itemID', 'lenço de algodão');
        const item2 = this.interactables.create(270, 190, 'boneca').setScale(1.5);
        item2.setData('itemID', 'boneca de milho');
        const item3 = this.interactables.create(410, 130, 'espelho').setScale(1.5);
        item3.setData('itemID', 'espelho antigo');

        this.startDialogueSequence([
            { speaker: 'Belonísia', portrait: 'belonisia', text: 'Bibiana... encontre as lembranças no terreiro. [Elo Silencioso 👁️]' }
        ]);
    }

    setupCapitulo2() {
        this.player.setPosition(60, 140);
        this.zeca = this.physics.add.staticSprite(220, 95, 'zeca').setScale(2);

        // Pilão de Zeca Chapéu Grande
        this.pilaoObj = this.physics.add.staticSprite(260, 110, 'pilao').setScale(1.8);

        const h1 = this.interactables.create(120, 80, 'herb').setScale(1.6);
        h1.setData('itemID', 'Capim-Santo');
        const h2 = this.interactables.create(340, 210, 'herb').setScale(1.6);
        h2.setData('itemID', 'Carqueja');
        const h3 = this.interactables.create(440, 90, 'herb').setScale(1.6);
        h3.setData('itemID', 'Arruda');

        // Spawna Chupins no Arrozal
        for (let i = 0; i < 5; i++) {
            let chupim = this.chupinsGroup.create(300 + (i * 30), 150 + (i * 12), 'chupim').setScale(1.8);
            chupim.setData('initialX', chupim.x);
        }

        this.startDialogueSequence([
            { speaker: 'Zeca Chapéu Grande', portrait: 'zeca', text: 'Pressione ESPAÇO para BATER PALMAS e espantar os chupins! Use o pilão para misturar as ervas.' }
        ]);
    }

    setupCapitulo3() {
        this.player.setPosition(60, 140);
        this.belonisia = this.physics.add.staticSprite(140, 140, 'belonisia').setScale(2);
        this.salu = this.physics.add.staticSprite(260, 120, 'zeca').setScale(2);

        for (let i = 0; i < 6; i++) {
            let candle = this.add.image(170 + (i * 45), 205, 'candle').setScale(1.6);
            candle.setData('lit', false);
            this.candlesArr = this.candlesArr || [];
            this.candlesArr.push(candle);
        }

        this.setupRhythmGame();

        this.startDialogueSequence([
            { speaker: 'Salu', portrait: 'zeca', text: 'Festa de Jarê! Pressione ESPAÇO no tempo exato da batida do tambor para acender as velas!' }
        ]);
    }

    // --- AÇÃO DE BATER PALMAS (Espantar Chupins em Área) ---
    realizarPalmas() {
        audio.sfxClap();
        this.cameras.main.shake(120, 0.005);

        // Onda Sonora Visual expandindo
        const wave = this.add.circle(this.player.x, this.player.y, 10, 0xfff8e7, 0.6);
        this.tweens.add({
            targets: wave,
            radius: 90,
            alpha: 0,
            duration: 400,
            onComplete: () => wave.destroy()
        });

        // Espanta chupins próximos
        if (this.currentCap === 2) {
            this.chupinsGroup.children.each(chupim => {
                if (chupim.active && Phaser.Math.Distance.Between(this.player.x, this.player.y, chupim.x, chupim.y) < 85) {
                    audio.sfxChupim();
                    this.tweens.add({
                        targets: chupim,
                        x: chupim.x + 100,
                        y: chupim.y - 60,
                        alpha: 0,
                        duration: 500,
                        onComplete: () => {
                            chupim.destroy();
                            if (this.chupinsGroup.countActive() === 0 && this.collectedItemsCount >= 3) {
                                this.hudObjText.setText('Tudo pronto! Fale com o Pai Zeca Chapéu Grande.');
                            }
                        }
                    });
                }
            });
        }

        // Mini-game de Ritmo (Capítulo 3)
        if (this.currentCap === 3 && this.rhythmActive) {
            audio.sfxDrum();
            let dist = Math.abs(this.rhythmMarker.x - this.targetZone.x);
            if (dist < 22) {
                // Acertou o tempo!
                this.triggerJuice(this.player.x, this.player.y - 20);
                if (this.candlesArr) {
                    let unlit = this.candlesArr.find(c => !c.getData('lit'));
                    if (unlit) {
                        unlit.setData('lit', true);
                        unlit.setTint(0xffff00);
                        this.tweens.add({ targets: unlit, scale: 2.2, duration: 150, yoyo: true });
                    }
                }
                if (this.candlesArr.every(c => c.getData('lit'))) {
                    this.rhythmActive = false;
                    this.time.delayedCall(1000, () => this.showEndingScreen());
                }
            }
        }
    }

    setupRhythmGame() {
        this.rhythmActive = true;
        this.rhythmContainer = this.add.container(GAME_WIDTH / 2, 45);

        const barBg = this.add.rectangle(0, 0, 180, 16, 0x1a0c06).setStrokeStyle(1, 0xd46b27);
        this.targetZone = this.add.rectangle(0, 0, 24, 16, 0xe76f51, 0.8);
        this.rhythmMarker = this.add.rectangle(-80, 0, 6, 20, 0xfff8e7);

        this.rhythmContainer.add([barBg, this.targetZone, this.rhythmMarker]);

        this.rhythmTween = this.tweens.add({
            targets: this.rhythmMarker,
            x: 80,
            duration: 800,
            yoyo: true,
            repeat: -1,
            ease: 'Sine.easeInOut'
        });
    }

    // --- INTERAÇÃO E QUESTS ---
    handleInteractions() {
        if (this.dialogueActive) return;

        // Ação de Bater Palmas / Espantar / Interagir
        this.realizarPalmas();

        if (this.currentCap === 1) {
            if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.belonisia.x, this.belonisia.y) < 35) {
                this.startDialogueSequence([
                    { speaker: 'Belonísia', portrait: 'belonisia', text: 'Nossos olhares se entendem sem palavras... Encontre as lembranças no terreiro. [Elo Silencioso 👁️]' }
                ]);
                return;
            }
            if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.donana.x, this.donana.y) < 35) {
                this.startDialogueSequence([
                    { speaker: 'Vó Donana', portrait: 'donana', text: 'Meninas... respeitem as histórias guardadas no fundo da mala...' }
                ]);
                return;
            }
            if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.fusco.x, this.fusco.y) < 35) {
                audio.sfxPickup();
                this.startDialogueSequence([
                    { speaker: 'Fusco', portrait: 'fusco', text: 'Au! Au! (Fusco abana o rabo fofamente pulando em suas 3 patas).' }
                ]);
                return;
            }
        } else if (this.currentCap === 2) {
            // Interação com o Pilão de Zeca
            if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.pilaoObj.x, this.pilaoObj.y) < 35) {
                audio.sfxPickup();
                this.triggerJuice(this.pilaoObj.x, this.pilaoObj.y);
                this.startDialogueSequence([
                    { speaker: 'Zeca Chapéu Grande', portrait: 'zeca', text: 'Você socou as ervas no pilão! A garrafada de Jarê está ganhando força.' }
                ]);
                return;
            }
            if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.zeca.x, this.zeca.y) < 35) {
                if (this.collectedItemsCount >= 3 && this.chupinsGroup.countActive() === 0) {
                    this.startDialogueSequence([
                        { speaker: 'Zeca Chapéu Grande', portrait: 'zeca', text: 'Abençoadas sejam! As ervas e a colheita estão salvas. Vamos unir o povo de Água Negra!' }
                    ], () => this.loadCapitulo(3));
                } else {
                    this.startDialogueSequence([
                        { speaker: 'Zeca Chapéu Grande', portrait: 'zeca', text: `Ervas colhidas: ${this.collectedItemsCount}/3. Espante os chupins do arrozal!` }
                    ]);
                }
                return;
            }
        } else if (this.currentCap === 3) {
            if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.belonisia.x, this.belonisia.y) < 35) {
                this.startDialogueSequence([
                    { speaker: 'Belonísia', portrait: 'belonisia', text: 'Bibiana, o rio Utinga corre em nossas veias. Somos a memória viva dos nossos ancestrais.' }
                ]);
                return;
            }
        }

        // Coleta de Itens com Juice
        this.interactables.children.each(item => {
            if (item.active && Phaser.Math.Distance.Between(this.player.x, this.player.y, item.x, item.y) < 30) {
                audio.sfxPickup();
                let itemName = item.getData('itemID');
                this.triggerJuice(item.x, item.y);
                item.destroy();
                this.collectedItemsCount++;

                if (this.currentCap === 1) {
                    this.startDialogueSequence([
                        { speaker: 'Bibiana', portrait: 'bibiana', text: `Você encontrou: ${itemName}! (${this.collectedItemsCount}/3).` }
                    ]);
                    if (this.collectedItemsCount >= 3) {
                        this.hudObjText.setText('Lembranças reunidas! O segredo aproxima as irmãs...');
                        this.time.delayedCall(2000, () => this.loadCapitulo(2));
                    }
                } else if (this.currentCap === 2) {
                    this.startDialogueSequence([
                        { speaker: 'Bibiana', portrait: 'bibiana', text: `Você colheu a erva medicinal: ${itemName}!` }
                    ]);
                }
            }
        });
    }

    // --- UI E DIÁLOGOS ---
    createUI() {
        const hudBg = this.add.rectangle(GAME_WIDTH / 2, 16, GAME_WIDTH - 20, 26, 0x1a0c06, 0.85)
            .setStrokeStyle(1, 0xd46b27);

        this.capTitleText = this.add.text(18, 10, '', {
            fontFamily: 'Courier New', fontSize: '10px', fontStyle: 'bold', color: '#f4a261'
        });

        this.hudObjText = this.add.text(175, 11, '', {
            fontFamily: 'Courier New', fontSize: '8px', color: '#fff8e7'
        });

        this.dialogueBox = this.add.container(0, 0);
        
        const boxBg = this.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT - 44, GAME_WIDTH - 20, 72, 0x2b1810, 0.96)
            .setStrokeStyle(2, 0x8b5a2b);
        
        const portraitBg = this.add.rectangle(44, GAME_HEIGHT - 44, 46, 52, 0x4a2e1b)
            .setStrokeStyle(1, 0xd46b27);

        this.portraitSprite = this.add.sprite(44, GAME_HEIGHT - 44, 'bibiana').setScale(2.2);

        this.speakerText = this.add.text(76, GAME_HEIGHT - 72, '', {
            fontFamily: 'Courier New', fontSize: '11px', fontStyle: 'bold', color: '#f4a261'
        });

        this.dialogueBodyText = this.add.text(76, GAME_HEIGHT - 56, '', {
            fontFamily: 'Courier New', fontSize: '9px', color: '#fff8e7', wordWrap: { width: GAME_WIDTH - 105 }
        });

        this.nextArrow = this.add.text(GAME_WIDTH - 25, GAME_HEIGHT - 22, '▼', {
            fontFamily: 'Courier New', fontSize: '10px', color: '#e76f51'
        });

        this.tweens.add({ targets: this.nextArrow, y: '+=3', duration: 400, yoyo: true, repeat: -1 });

        this.dialogueBox.add([boxBg, portraitBg, this.portraitSprite, this.speakerText, this.dialogueBodyText, this.nextArrow]);
        this.dialogueBox.setVisible(false);
    }

    startDialogueSequence(dialogues, onComplete = null) {
        this.dialogueQueue = dialogues;
        this.onDialogueComplete = onComplete;
        this.dialogueActive = true;
        this.dialogueBox.setVisible(true);
        this.advanceDialogue();
    }

    advanceDialogue() {
        if (this.dialogueTimer) this.dialogueTimer.remove();

        if (this.dialogueQueue.length === 0) {
            this.dialogueActive = false;
            this.dialogueBox.setVisible(false);
            if (this.onDialogueComplete) this.onDialogueComplete();
            return;
        }

        const current = this.dialogueQueue.shift();
        this.speakerText.setText(current.speaker);
        this.portraitSprite.setTexture(current.portrait);
        this.dialogueBodyText.setText('');

        let charIndex = 0;
        const fullText = current.text;

        this.dialogueTimer = this.time.addEvent({
            delay: 20,
            repeat: fullText.length - 1,
            callback: () => {
                this.dialogueBodyText.setText(fullText.substring(0, charIndex + 1));
                charIndex++;
                if (charIndex % 3 === 0) audio.sfxText();
            }
        });
    }

    showEndingScreen() {
        this.dialogueActive = true;
        if (this.rhythmTween) this.rhythmTween.stop();
        this.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT / 2, GAME_WIDTH, GAME_HEIGHT, 0x0d0907, 0.96);
        
        this.add.text(GAME_WIDTH / 2, 60, 'FIM DA JORNADA', {
            fontFamily: 'Courier New', fontSize: '22px', fontStyle: 'bold', color: '#f4a261'
        }).setOrigin(0.5);

        const poem = [
            "Bibiana e Belonísia permaneceram unidas,",
            "como o curso dos rios Santo Antônio e Utinga.",
            "A terra de Água Negra guardará suas vozes e passos.",
            "",
            "\"Sobre a terra tudo é força, tudo é permanência.\"",
            "— Itamar Vieira Junior"
        ];

        this.add.text(GAME_WIDTH / 2, 140, poem.join('\n'), {
            fontFamily: 'Courier New', fontSize: '10px', color: '#fff8e7', align: 'center', lineSpacing: 6
        }).setOrigin(0.5);

        const restartBtn = this.add.text(GAME_WIDTH / 2, 230, '[ JOGAR NOVAMENTE ]', {
            fontFamily: 'Courier New', fontSize: '11px', fontStyle: 'bold', color: '#ffe66d'
        }).setOrigin(0.5).setInteractive({ useHandCursor: true });

        restartBtn.on('pointerdown', () => location.reload());
    }

    update() {
        if (this.dialogueActive) {
            this.player.setVelocity(0);
            this.playerShadow.setPosition(this.player.x, this.player.y + 10);
            if (Phaser.Input.Keyboard.JustDown(this.spaceKey) || touchState.interact) {
                touchState.interact = false;
                this.advanceDialogue();
            }
            return;
        }

        const speed = 120;
        let vx = 0, vy = 0;

        if (this.cursors.left.isDown || this.wasd.A.isDown || touchState.left) { vx = -speed; this.player.flipX = true; }
        else if (this.cursors.right.isDown || this.wasd.D.isDown || touchState.right) { vx = speed; this.player.flipX = false; }

        if (this.cursors.up.isDown || this.wasd.W.isDown || touchState.up) { vy = -speed; }
        else if (this.cursors.down.isDown || this.wasd.S.isDown || touchState.down) { vy = speed; }

        this.player.setVelocity(vx, vy);
        this.playerShadow.setPosition(this.player.x, this.player.y + 10);

        if (vx !== 0 || vy !== 0) {
            if (Math.random() < 0.05) audio.sfxStep();
        }

        if (Phaser.Input.Keyboard.JustDown(this.spaceKey) || touchState.interact) {
            touchState.interact = false;
            this.handleInteractions();
        }
    }
}

// --- 5. INICIALIZAÇÃO DO PHASER 3 ---
const config = {
    type: Phaser.AUTO,
    width: GAME_WIDTH,
    height: GAME_HEIGHT,
    parent: 'game-container',
    pixelArt: true,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },
    physics: {
        default: 'arcade',
        arcade: { debug: false }
    },
    scene: [BootScene, TitleScene, GameScene]
};

const game = new Phaser.Game(config);
</script>
